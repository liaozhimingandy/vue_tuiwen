<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <link rel="icon" type="image/svg+xml" href="/logo.svg"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>推文 | alsoapp.com</title>
    <style>
        #global‑splash {
            position: fixed;
            inset: 0;
            background: #ffffff;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
            justify-content: center;
            z-index: 99999;
            transition: opacity 0.35s ease;
        }

        #global‑splash .logo-wrap {
            position: relative;
            width: 80px;
            height: 80px;
        }

        #global‑splash .spinner-ring {
            position: absolute;
            inset: 0;
            border: 3px solid #e8e8e8;
            border-top: 3px solid #027AFF;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        #global‑splash .logo-img {
            position: absolute;
            inset: 0;
            width: 52px;
            height: 52px;
            margin: auto;
            border-radius: 50%;
        }

        #global‑splash .tip-text {
            margin-top: 8px;
            color: #666;
            font-size: 15px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        #app {
            display: none;
        }
    </style>
</head>
<body>
<!-- 唯一全局启动遮罩，全程复用，JS不再重新创建DOM -->
<div id="global‑splash">
    <div class="logo-wrap">
        <div class="spinner-ring"></div>
        <img class="logo-img" src="/logo.svg" alt="logo"/>
    </div>
    <div class="tip-text">加载中…</div>
</div>
<div id="app"></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
