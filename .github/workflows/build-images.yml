name: Build Images

# =============================================================================
# 镜像构建与推送：Docker Hub + 阿里云 ACR（配了哪个就推哪个，都没配则只构建）
#
# 与 CI 的分工：CI 只验证不推送；本工作流才登录仓库并推送。
#
# 镜像来源：仓库根目录的 Dockerfile（nginx + dist），构建上下文就是当前提交，
#         构建产物 == 这次 commit。docker/latest/Dockerfile.* 那套多镜像链
#         会去 GitHub 下载 main 分支的 zip，与本工作流无关，这里不再使用。
#
# 版本映射：
#   push main        → dev / dev-<sha>
#   push develop     → develop / develop-<sha>
#   push tag vA.B.C  → A.B.C / A.B / latest
#   workflow_dispatch→ 可手动指定版本、是否推送
#
# 凭据（沿用后端仓库同一套命名，没配置就自动跳过推送）：
#   Docker Hub : secrets.DOCKERHUB_USERNAME + secrets.DOCKERHUB_TOKEN
#                兼容老命名 secrets.DOCKER_USERNAME + secrets.DOCKER_PASSWORD
#   阿里云 ACR : secrets.ALIYUN_REGISTRY（如 registry.cn-shenzhen.aliyuncs.com）
#                vars.ALIYUN_NAMESPACE（ACR 命名空间，必填）
#                secrets.ALIYUN_USERNAME + secrets.ALIYUN_PASSWORD
# =============================================================================
on:
  push:
    branches: [main, develop]
    tags: ['v*']
    # 只有影响产物的改动才值得重建镜像
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'vite.config.ts'
      # tsconfig / 自动生成的 d.ts 会改变 type-check 结果（build 里先跑 type-check）
      - 'tsconfig*.json'
      - '*.d.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker/latest/server/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '覆盖版本号（留空=dev）'
        required: false
        type: string
      push:
        description: '是否推送到镜像仓库'
        required: false
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

env:
  # 镜像仓库里的仓库名（Docker Hub 与 ACR 共用）
  IMAGE_NAME: vue_tuiwen

jobs:
  # ---------------------------------------------------------------------------
  # 1) 计算版本 + 探测推送凭据（真实登录一次，避免无效凭据一路带到 push 才报 401）
  # ---------------------------------------------------------------------------
  meta:
    name: 计算版本与推送目标
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.calc.outputs.version }}
      tags: ${{ steps.calc.outputs.tags }}
      build_type: ${{ steps.calc.outputs.build_type }}
      # 只输出布尔量。镜像名一律不跨作业传：它的值里含 DOCKER_USERNAME，
      # 而 GitHub 会直接丢弃「值里可能含 secret」的 job output
      # （日志里表现为 warning: Skip output 'hub_image' since it may contain secret），
      # 下游拿到的就是空字符串，最后只报一句 ":dev is not a valid reference"。
      # 镜像名改由各作业自己从 secrets 现算。
      push_hub: ${{ steps.probe.outputs.push_hub }}
      push_aliyun: ${{ steps.probe.outputs.push_aliyun }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 计算版本与标签
        id: calc
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_PUSH: ${{ inputs.push }}
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA::7}"
          BUILD_TYPE=""
          VERSION=""
          EXTRA_TAGS=""
          WANT_PUSH="false"

          if [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "tag" ]; then
            # v26.9.17 -> 26.9.17；同时滚动 26.9 与 latest
            [[ "${REF_NAME}" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]] \
              || { echo "::error::Tag ${REF_NAME} 不符合 vA.B / vA.B.C 规范"; exit 1; }
            VERSION="${REF_NAME#v}"
            EXTRA_TAGS="$(echo "${VERSION}" | cut -d. -f1,2) latest"
            WANT_PUSH="true"
            BUILD_TYPE="正式发布"
          elif [ "${EVENT_NAME}" = "push" ] && [ "${REF_TYPE}" = "branch" ]; then
            case "${REF_NAME}" in
              main)    VERSION="dev";     EXTRA_TAGS="dev-${SHORT_SHA}";     WANT_PUSH="true"; BUILD_TYPE="开发构建(main)" ;;
              develop) VERSION="develop"; EXTRA_TAGS="develop-${SHORT_SHA}"; WANT_PUSH="true"; BUILD_TYPE="开发构建(develop)" ;;
              *)       echo "::notice::分支 ${REF_NAME} 不在构建范围，跳过"; VERSION="skip" ;;
            esac
          else
            VERSION="${INPUT_VERSION:-dev}"
            WANT_PUSH="${INPUT_PUSH:-true}"
            BUILD_TYPE="手动构建"
            # 手动填的版本号按 tag 的同款规则滚动浮动标签
            if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              EXTRA_TAGS="$(echo "${VERSION}" | cut -d. -f1,2) latest"
            elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+$ ]]; then
              EXTRA_TAGS="$(echo "${VERSION}" | cut -d. -f1)"
            elif [ "${VERSION}" = "dev" ]; then
              EXTRA_TAGS="dev-${SHORT_SHA}"
            fi
          fi

          # 空版本会拼出 `vue_tuiwen:` 这种非法标签，docker 只报 invalid reference format，
          # 看不出根因，这里提前拦下来（skip 是"不在构建范围"的显式标记，不算空）
          if [ -z "${VERSION}" ]; then
            echo "::error title=版本号为空::引用 ${REF_TYPE}:${REF_NAME} 没有匹配到任何版本规则"
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "tags=${EXTRA_TAGS}"
            echo "build_type=${BUILD_TYPE}"
            echo "want_push=${WANT_PUSH}"
          } >> "$GITHUB_OUTPUT"

      - name: 探测推送凭据（真实登录一次）
        id: probe
        env:
          WANT_PUSH: ${{ steps.calc.outputs.want_push }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          HUB_PASS: ${{ secrets.DOCKERHUB_TOKEN || secrets.DOCKER_PASSWORD }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}
          ALI_USER: ${{ secrets.ALIYUN_USERNAME || secrets.DOCKER_USERNAME }}
          ALI_PASS: ${{ secrets.ALIYUN_PASSWORD || secrets.DOCKER_PASSWORD }}
        run: |
          set -uo pipefail
          PUSH_HUB="false"
          PUSH_ALI="false"

          # secret 从网页复制时很容易带上尾随空格/换行。这里的 trim 不是洁癖：
          # ALIYUN_REGISTRY 末尾多一个空格，docker login 直接报
          # `unable to parse server address: invalid character " " in host name`，
          # 而报错里显示的是 `https://*** `，根本看不出问题在空格上。
          trim() { printf '%s' "${1:-}" | tr -d '[:space:]'; }

          HUB_USER="$(trim "${HUB_USER:-}")"
          ALIYUN_REGISTRY="$(trim "${ALIYUN_REGISTRY:-}")"
          ALIYUN_NAMESPACE="$(trim "${ALIYUN_NAMESPACE:-}")"
          ALI_USER="$(trim "${ALI_USER:-}")"

          # 命名空间优先用「能登录的那个账号」，不要拿 GitHub 用户名猜：
          # 猜出来的路径必然存在不了，报错只会是 repository does not exist or may require authorization
          HUB_NS="$(trim "${HUB_USER:-${GITHUB_REPOSITORY_OWNER:-}}")"
          HUB_IMAGE="$(trim "${HUB_NS}/${IMAGE_NAME}")"

          # 用户名填成邮箱时，docker tag 只会回一句 invalid reference format，看不出是哪个 secret 错了
          case "${HUB_IMAGE}" in
            *@*)
              echo "::error title=Docker Hub 用户名非法::拼出的镜像名是 ${HUB_IMAGE}，含 @。检查 secrets.DOCKERHUB_USERNAME / DOCKER_USERNAME 是否填成了邮箱"
              exit 1 ;;
          esac

          # 解析结果本身要能看见（用户名会被打码成 ***，长度仍是真实的）：
          # 出问题时先看这行就知道是没解析出来，还是下游没接到
          echo "::notice title=镜像名解析::HUB_IMAGE=${HUB_IMAGE} (长度 ${#HUB_IMAGE})"

          # 密码只去掉回车换行（保留中间可能出现的空格），
          # 否则 --password-stdin 会把多出来的换行当成密码的一部分，报 unauthorized
          HUB_PASS="$(printf '%s' "${HUB_PASS:-}" | tr -d '\r\n')"
          ALI_PASS="$(printf '%s' "${ALI_PASS:-}" | tr -d '\r\n')"

          if [ "${WANT_PUSH}" = "true" ] && [ -n "${HUB_USER}" ] && [ -n "${HUB_PASS}" ]; then
            # 登录失败的原文必须留下：只写 "凭据无效" 会让人分不清是 token 没写权限、
            # 开了 2FA 还是账号密码错，而这三种的处理方式完全不同
            if HUB_ERR="$(echo "${HUB_PASS}" | docker login -u "${HUB_USER}" --password-stdin 2>&1 >/dev/null)"; then
              PUSH_HUB="true"
              echo "Docker Hub 登录成功：${HUB_IMAGE}"

              # read-only 的 token 也能登录成功（login 只验证身份），却在 push 时报
              # unauthorized: access token has insufficient scopes。
              # 问一次 auth.docker.io 要 push scope 的 token，看返回的 actions 里有没有 push，
              # 把这个问题提前到 6 秒发现，而不是等一次构建跑完。
              SCOPE_JSON="$(curl -fsS -u "${HUB_USER}:${HUB_PASS}" \
                "https://auth.docker.io/token?service=registry.docker.io&scope=repository:${HUB_IMAGE}:push,pull" 2>/dev/null || true)"
              case "${SCOPE_JSON}" in
                "") echo "::warning title=无法校验 token 写权限::拿不到 auth.docker.io 的响应（网络或限流），直接尝试推送" ;;
                *'"push"'*) echo "token 具备 push 权限" ;;
                *)
                  echo "::error title=Docker Hub token 无写权限::能登录但换不到 push scope，推送必然失败。去 Docker Hub → Account settings → Personal access tokens 重建一个 Read & Write 的 token，更新 secrets.DOCKERHUB_TOKEN（或 DOCKER_PASSWORD）"
                  exit 1 ;;
              esac
            else
              echo "::warning title=Docker Hub 登录失败::$(echo "${HUB_ERR}" | tail -1)"
            fi
          else
            echo "Docker Hub 凭据未配置或本次不需要推送，跳过"
          fi

          if [ "${WANT_PUSH}" = "true" ] && [ -n "${ALIYUN_REGISTRY}" ] \
             && [ -n "${ALIYUN_NAMESPACE}" ] && [ -n "${ALI_USER}" ] && [ -n "${ALI_PASS}" ]; then
            if ALI_ERR="$(echo "${ALI_PASS}" | docker login -u "${ALI_USER}" --password-stdin "${ALIYUN_REGISTRY}" 2>&1 >/dev/null)"; then
              PUSH_ALI="true"
              echo "阿里云 ACR 登录成功：${ALIYUN_REGISTRY}/${ALIYUN_NAMESPACE}/${IMAGE_NAME}"
            else
              echo "::warning title=阿里云登录失败::$(echo "${ALI_ERR}" | tail -1)"
            fi
          else
            echo "阿里云凭据未配置（或缺少 vars.ALIYUN_NAMESPACE），跳过"
          fi

          # 只写布尔量，镜像名留在本作业内使用（见 job outputs 处的说明）
          {
            echo "push_hub=${PUSH_HUB}"
            echo "push_aliyun=${PUSH_ALI}"
          } >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # 2) 构建（一次），再按需打标签推送
  # ---------------------------------------------------------------------------
  build:
    name: 构建并推送镜像
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [meta]
    if: needs.meta.outputs.version != 'skip'
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: 配置 Buildx（container 驱动才能用 gha 缓存）
        run: |
          set -euo pipefail
          docker buildx create --driver docker-container --name ci --use
          docker buildx inspect --bootstrap

      - name: 构建镜像
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx build \
            --build-arg APP_BUILD="${VERSION}-${GITHUB_SHA::7}" \
            --cache-from type=gha,scope=vue-tuiwen \
            --cache-to type=gha,scope=vue-tuiwen,mode=max \
            --load \
            -t "${IMAGE_NAME}:${VERSION}" \
            .

      - name: 推送到 Docker Hub
        if: needs.meta.outputs.push_hub == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          EXTRA_TAGS: ${{ needs.meta.outputs.tags }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
        run: |
          set -euo pipefail

          # 镜像名在本作业内现算，不从 meta 的 job output 取：
          # 它的值含 DOCKER_USERNAME，GitHub 会丢弃这类 output（Skip output ... may contain secret）
          IMAGE="$(printf '%s/%s' "${HUB_USER:-}" "${IMAGE_NAME}" | tr -d '[:space:]')"

          if [ "${IMAGE}" = "/${IMAGE_NAME}" ]; then
            echo "::error title=镜像名为空::读不到 secrets.DOCKERHUB_USERNAME / DOCKER_USERNAME，或值里只有空白字符"
            exit 1
          fi

          # 打标签 + 推送，失败时把 docker 的原文写进注解。
          # 只让 job 变红是没用的：日志要仓库管理员权限才看得到，
          # 而注解在 run 页面顶部和 API 里都能直接读到（denied / unauthorized 一眼可辨）。
          tag_and_push() {
            local ref="$1" out
            if ! out=$(docker tag "${IMAGE_NAME}:${VERSION}" "${ref}" 2>&1); then
              echo "::error title=docker tag 失败::${ref} :: $(echo "${out}" | tr '\n' ' ' | cut -c1-280)"
              exit 1
            fi
            if ! out=$(docker push "${ref}" 2>&1); then
              # 只截前 280 字会截到 "Preparing" 的分层日志，真正的 denied/unauthorized 在后面，
              # 所以先按关键字挑出关键行，挑不到再退回最后两行
              hint="$(printf '%s\n' "${out}" | grep -iE 'denied|unauthorized|forbidden|not found|invalid|error' | tail -2 | tr '\n' ' ')"
              [ -z "${hint}" ] && hint="$(printf '%s\n' "${out}" | tail -2 | tr '\n' ' ')"
              echo "::error title=Docker Hub 推送失败::${ref} :: $(printf '%s' "${hint}" | cut -c1-300)"
              printf '%s\n' "${out}" | tail -20 >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "已推送 ${ref}"
          }

          tag_and_push "${IMAGE}:${VERSION}"
          for t in ${EXTRA_TAGS}; do tag_and_push "${IMAGE}:${t}"; done

      - name: 推送到阿里云 ACR
        if: needs.meta.outputs.push_aliyun == 'true'
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          EXTRA_TAGS: ${{ needs.meta.outputs.tags }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}
        run: |
          set -euo pipefail

          # 同上：registry/namespace 都现算，并且必须 trim —— 线上曾出现
          # ALIYUN_REGISTRY 末尾带空格，docker login 报 `invalid character " " in host name`
          IMAGE="$(printf '%s/%s/%s' "${ALIYUN_REGISTRY:-}" "${ALIYUN_NAMESPACE:-}" "${IMAGE_NAME}" | tr -d '[:space:]')"

          if [ "${IMAGE}" = "//${IMAGE_NAME}" ]; then
            echo "::error title=阿里云镜像名为空::缺少 secrets.ALIYUN_REGISTRY 或 vars.ALIYUN_NAMESPACE"
            exit 1
          fi

          tag_and_push() {
            local ref="$1" out
            if ! out=$(docker tag "${IMAGE_NAME}:${VERSION}" "${ref}" 2>&1); then
              echo "::error title=docker tag 失败::${ref} :: $(echo "${out}" | tr '\n' ' ' | cut -c1-280)"
              exit 1
            fi
            if ! out=$(docker push "${ref}" 2>&1); then
              hint="$(printf '%s\n' "${out}" | grep -iE 'denied|unauthorized|forbidden|not found|invalid|error' | tail -2 | tr '\n' ' ')"
              [ -z "${hint}" ] && hint="$(printf '%s\n' "${out}" | tail -2 | tr '\n' ' ')"
              echo "::error title=阿里云 ACR 推送失败::${ref} :: $(printf '%s' "${hint}" | cut -c1-300)"
              printf '%s\n' "${out}" | tail -20 >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "已推送 ${ref}"
          }

          tag_and_push "${IMAGE}:${VERSION}"
          for t in ${EXTRA_TAGS}; do tag_and_push "${IMAGE}:${t}"; done

      - name: 写入摘要
        if: always()
        env:
          VERSION: ${{ needs.meta.outputs.version }}
          EXTRA_TAGS: ${{ needs.meta.outputs.tags }}
          BUILD_TYPE: ${{ needs.meta.outputs.build_type }}
          PUSH_HUB: ${{ needs.meta.outputs.push_hub }}
          PUSH_ALI: ${{ needs.meta.outputs.push_aliyun }}
          HUB_USER: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKER_USERNAME }}
          ALIYUN_REGISTRY: ${{ secrets.ALIYUN_REGISTRY }}
          ALIYUN_NAMESPACE: ${{ vars.ALIYUN_NAMESPACE || secrets.ALIYUN_NAMESPACE }}
        run: |
          set -euo pipefail
          # 与推送步骤同样现算（job output 不能带 secret）
          HUB_IMAGE="$(printf '%s/%s' "${HUB_USER:-}" "${IMAGE_NAME}" | tr -d '[:space:]')"
          ALI_IMAGE="$(printf '%s/%s/%s' "${ALIYUN_REGISTRY:-}" "${ALIYUN_NAMESPACE:-}" "${IMAGE_NAME}" | tr -d '[:space:]')"
          if [ "${HUB_IMAGE}" = "/${IMAGE_NAME}" ]; then HUB_IMAGE="未配置"; fi
          if [ "${ALI_IMAGE}" = "//${IMAGE_NAME}" ]; then ALI_IMAGE="未配置"; fi

          size=$(docker images "${IMAGE_NAME}:${VERSION}" --format '{{.Size}}' | head -1 || true)
          {
            echo "## 前端镜像构建"
            echo ""
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 构建类型 | ${BUILD_TYPE} |"
            echo "| 版本标签 | \`${VERSION}\` ${EXTRA_TAGS} |"
            echo "| 提交 | \`${GITHUB_SHA::7}\` |"
            echo "| 镜像体积 | ${size:-未知} |"
            echo "| 推送 Docker Hub | ${PUSH_HUB}（${HUB_IMAGE}） |"
            echo "| 推送阿里云 ACR | ${PUSH_ALI}（${ALI_IMAGE}） |"
          } >> "$GITHUB_STEP_SUMMARY"
